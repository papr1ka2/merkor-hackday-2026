questions:
  - id: auto_renew
    text: Does the agreement renew automatically at the end of the initial term?
    type: bool

  - id: nonrenewal_notice_days
    text: How many days before the end of the term must a party give notice of non-renewal?
    type: number

  - id: liability_cap_months
    text: The general liability cap equals the fees paid or payable over how many months?
    type: number

  - id: customer_termination_for_convenience
    text: May the Customer terminate the agreement for convenience?
    type: bool

  - id: governing_law
    text: Which jurisdiction's law governs the agreement?
    type: choice
    choices: [New York, Delaware, California, Other]

  - id: effective_date
    text: What is the Effective Date of the agreement?
    type: date

  - id: breach_notice_hours
    text: Within how many hours must the Provider notify the Customer of a Security Incident?
    type: number

  - id: cap_carveouts
    text: What, if anything, is excluded from the general limitation of liability?
    type: text
