[project]
name = "cqa"
version = "0.1.0"
description = "Contract QA benchmark: grade agent answers against expert answer keys across contract versions (redlines)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "pypdf>=7.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
cqa = "cqa.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
