[project]
name = "verdict"
version = "0.1.0"
description = "VERDICT (by Q.E.D. Guys): a contract QA benchmark graded against expert answers, across contract redlines."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "pypdf>=7.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
verdict = "verdict.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
