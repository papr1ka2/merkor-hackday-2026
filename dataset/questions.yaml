    - documents/anonymized-demo-contracts/autoco_nda/r02__AuditCo - AutoCo Mutual NDA (2026.10.26 AUDITCO DRAFT).docx
    - documents/anonymized-demo-contracts/autoco_nda/r01__AuditCo - AutoCo Mutual NDA (draft).docx
  evidence:
    - file: documents/anonymized-demo-contracts/autoco_nda/r02__AuditCo - AutoCo Mutual NDA (2026.10.26 AUDITCO DRAFT).docx
      quote: |-
        no Affiliate or its Representatives may receive Confidential Information unless that Affiliate has joined this Agreement under Section 12.3
  answer: |-
    The Affiliate must first join the Agreement through a written joinder signed by AutoCo, AuditCo and the Affiliate. The joinder must state the Affiliate's legal name, address, effective date and permitted scope. Under the draft no joinder is needed: an Affiliate is a "Representative" and may receive the information on need-to-know and notice alone.
  basis: |-
    Redline §2.3: "no Affiliate or its Representatives may receive Confidential Information unless that Affiliate has joined this Agreement under Section 12.3". §12.3 sets out the joinder. The draft's "Representatives" definition includes Affiliates.

