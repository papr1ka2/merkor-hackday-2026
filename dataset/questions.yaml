    - file: documents/anonymized-demo-contracts/labsco_eval/r05__Evaluation Agreement - LabsCo (final 2.18.26).docx
      quote: if by email, upon confirmed delivery to the recipient's email address
  answer: |-
    (a) 18 March 2026. The one-month Evaluation Period expires on 18 March, before the termination notice would take effect (email notice is given on confirmed delivery, 12 March, plus ten days' prior notice = 22 March). (b) 18 March 2031: confidentiality survives five years from termination or expiration. The one-month period appears only in the final signed version; every tracked draft, including LabsCo Edits 2.18.26, still says two months, and the change was never shown as a tracked change.
