- id: W.1
  split_from: W
  source: expert
  reviewed: false
  title: |-
    GAPL–AuditCo vendor services agreement (SL 5.8.26, GF edits) — did the client's licence instructions survive?
  prompt: |-
    Before negotiating, AuditCo told its counsel three things. GrantorCo may run and modify the delivered software but must never open-source it. Sublicensing should be tightly controlled. And the licence should cover only the deliverable packages ("grantor_modules"), with AuditCo's other IP licensed only as far as needed to run them, as in the SL 4.10.26 grant letter. Reading the final GF-edits vendor services agreement, may GAPL sublicense the Engagement IP to its own Affiliates without AuditCo's approval?
  files:
    - documents/anonymized-demo-contracts/gapl_vendor_services/r03__GAPL Vendor Services Agreement (AuditCo, Inc.) 20260424 (SL 5.8.26) (GF edits).docx
    - documents/anonymized-demo-contracts/gf_grant_letter/r02__GR-0001 SpecAgent - Grant Agreement (SL 4.10.26).docx
  expected: {type: bool, value: true}
  evidence:
    - file: documents/anonymized-demo-contracts/gapl_vendor_services/r03__GAPL Vendor Services Agreement (AuditCo, Inc.) 20260424 (SL 5.8.26) (GF edits).docx
      quote: the Company may sublicense the Engagement IP to its Affiliates
  answer: |-
    (i) Yes: GAPL may sublicense to its Affiliates without approval; any other third party needs AuditCo's prior approval. (ii) No: GAPL and its Affiliates may not distribute the Engagement IP as open source or otherwise. (iii) No: the deliverable/private-module split from the SL 4.10.26 grant letter did not survive; the VSA licenses all Engagement IP for non-commercial internal use, with no express licence of AuditCo's background IP. Fidelity: the open-source ban landed; the module-scoped licence was changed.
  basis: |-
    GF edits §7.2: "the Company may sublicense the Engagement IP to its Affiliates. Any sublicensing to any other third party shall require the Vendor's prior approval." §7.3(a): may not "distribute (as open source or otherwise)". Contrast SL 4.10.26: licence limited to packages identified as "grantor_modules".

