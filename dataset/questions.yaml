- id: G
  source: expert
  reviewed: false
  title: |-
    ClientCo–AuditCo evaluation agreement (AuditCo's original January 2026 draft, "Evaluation Agreement - Pen Testing")
  prompt: |-
    Under this draft, ClientCo's engineers write updated source-code inputs during the evaluation and send them to AuditCo. Who owns those Inputs, and may ClientCo share them with an outside security consultant without AuditCo's consent?
  files:
    - documents/anonymized-demo-contracts/clientco_eval/r01__Evaluation Agreement - Pen Testing.docx
  expected:
    inputs_owner: {type: choice, choices: [AuditCo, ClientCo], value: AuditCo}
    clientco_may_share_without_auditco_consent: {type: bool, value: false}
  evidence:
    - file: documents/anonymized-demo-contracts/clientco_eval/r01__Evaluation Agreement - Pen Testing.docx
      quote: |-
        All Inputs, Outputs and Feedback is owned by and is deemed the Confidential Information and intellectual property of AuditCo
    - file: documents/anonymized-demo-contracts/clientco_eval/r01__Evaluation Agreement - Pen Testing.docx
      quote: shall not disclose … to any third party without the prior written consent of AuditCo
  answer: |-
    AuditCo owns the Inputs. ClientCo may not share them without AuditCo's prior written consent, because they are AuditCo's Confidential Information. (Under the ClientCo 2.6.26 turn, the answer flips and ClientCo owns them.)
