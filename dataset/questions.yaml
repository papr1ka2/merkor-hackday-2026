- id: G.1
  split_from: G
  source: expert
  reviewed: false
  title: |-
    ClientCo–AuditCo evaluation agreement (AuditCo's original January 2026 draft, "Evaluation Agreement - Pen Testing")
  prompt: |-
    Under this draft, ClientCo's engineers write updated source-code inputs during the evaluation and send them to AuditCo. Who owns those Inputs?
  files:
    - documents/anonymized-demo-contracts/clientco_eval/r01__Evaluation Agreement - Pen Testing.docx
  expected: {type: choice, choices: [AuditCo, ClientCo], value: AuditCo}
  evidence:
