- id: H
  source: expert
  reviewed: false
  title: GrantorCo Foundation grant letter (SL 4.10.26 redline)
  prompt: |-
    AuditCo signs the Grant Letter and receives the upfront disbursement. GrantorCo Foundation later determines that Milestones 1, 2 and 3 have been achieved and pays each of them. AuditCo has spent every dollar on the approved project, but declines to release any of the funded software under an open-source licence. GF invokes the Licensing clause of Addendum I and demands a full refund of all Grant funds paid. Reading the Grant Letter with all of Summit LLP's tracked changes accepted, how much must AuditCo refund?
  files:
    - documents/anonymized-demo-contracts/gf_grant_letter/r01__GR-0001 SpecAgent - Grant Agreement (SL 4.10.26).docx
  expected:
    refund_usd: {type: number, value: 0}
  evidence:
    - file: documents/anonymized-demo-contracts/gf_grant_letter/r01__GR-0001 SpecAgent - Grant Agreement (SL 4.10.26).docx
      quote: This Section C expressly supersedes Section F in Addendum I.
  answer: |-
    US$0. Without the redline, AuditCo would have to refund US$109,000 (US$34,000 upfront + US$41,000 + US$17,000 + US$17,000).
