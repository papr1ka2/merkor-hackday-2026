  title: |-
    ChainCo–AuditCo free trial agreement — which counsel change reopened the negotiation? (GC Edits → Summit LLP 5-18-2026)
  prompt: |-
    ChainCo's general counsel marked up AuditCo's 2026.05.11 draft (the "GC Edits" version), including a "for the avoidance of doubt" carve-out in the "Derivative Works" definition and a condition on AuditCo's use of Inputs, Outputs and Feedback. AuditCo's counsel then issued the 5-18-2026 redline, which ChainCo only partly accepted, so another round followed. In the 5-18-2026 redline, was the general counsel's avoidance-of-doubt carve-out kept, narrowed or deleted?
  files:
