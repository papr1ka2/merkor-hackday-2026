- id: V.1
  split_from: V
  source: expert
  reviewed: false
  title: |-
    AuditCo–StudioCo master services agreement — the edit AuditCo escalated to counsel (StudioCo Cmts 19 Mar 26)
  prompt: |-
    StudioCo's counsel returned AuditCo's MSA with many tracked changes. AuditCo accepted most of them but escalated one inserted sentence in §1.2 (Deliverables) to its own counsel instead of signing. Accepting all tracked changes, may the agreement exclude or limit AuditCo's liability for losses caused by its ordinary negligence?
  files:
    - documents/anonymized-demo-contracts/studioco_msa/r01__AUDITCO MSA (StudioCo Cmts 19 Mar 26).docx
  expected: {type: bool, value: false}
  evidence:
    - file: documents/anonymized-demo-contracts/studioco_msa/r01__AUDITCO MSA (StudioCo Cmts 19 Mar 26).docx
      quote: |-
        nothing in this Agreement shall exclude or limit AuditCo’s liability for losses arising from AuditCo’s negligence, wilful misconduct or fraud
  answer: |-
    No, and no. §1.2 as inserted makes AuditCo's liability for negligence (not just gross negligence) impossible to exclude or limit, which is the sentence AuditCo escalated; it wanted the standard limited to gross negligence, wilful misconduct or fraud. The Mutual Indemnification clause, as edited in the same draft, is triggered only by fraud, gross negligence or wilful misconduct, so ordinary negligence becomes uncapped direct liability under §1.2 while staying outside the indemnity.
  basis: |-
    §1.2 insertion: "nothing in this Agreement shall exclude or limit AuditCo’s liability for losses arising from AuditCo’s negligence, wilful misconduct or fraud." Mutual Indemnification: "arising from or relates to the fraud, gross negligence or willful misconduct of the Indemnifying Party".

