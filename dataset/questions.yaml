    Original Addendum I, Publicity: "You will allow GF to review and approve the text of any proposed publicity concerning this Grant prior to its release". SL 4.10.26 Publicity, inserted: "are permitted to publicly announce receipt of the Grant without GF’s prior written consent". SL 4.10.26 Information and Access, inserted: "to confirm your use of Grant funds in accordance with this Addendum I".

