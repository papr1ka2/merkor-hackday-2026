# --- R: VentureCo SAFE, from the team's legal interactions ---

- id: R.1
  split_from: R
  source: expert
  reviewed: false
  title: 'VentureCo SAFE: conditional amendment, automatic reversion, and equity conversion'
  prompt: |-
    VentureCo and AuditCo execute and deliver the Amendment and Restatement Agreement, effective October 19, 2026. FundCo never closes the specified program investment, neither party sends a notice of rejection or abandonment, and the closing deadline is not extended. VentureCo makes no MFN election. On May 3, 2027, AuditCo holds the initial closing of an equity financing in which Standard Preferred Stock sells for $1.60 per share. The Company's Company Capitalization immediately before the financing is 14,000,000 shares. Under the two agreements, how many shares does VentureCo receive on conversion of its investment?
  files:
    - documents/anonymized-demo-contracts/ventureco_safe_ar/r01__2. VentureCo (A&R draft).pdf
    - documents/anonymized-demo-contracts/ventureco_safe/r01__1. VentureCo (Original).pdf
  expected: {type: number, value: 410000}
  evidence:
    - file: documents/anonymized-demo-contracts/ventureco_safe_ar/r01__2. VentureCo (A&R draft).pdf
      quote: is 11:59 p.m. Pacific time on April 1, 2027
    - file: documents/anonymized-demo-contracts/ventureco_safe_ar/r01__2. VentureCo (A&R draft).pdf
      quote: expiration of the Closing Deadline without FundCo Closing
    - file: documents/anonymized-demo-contracts/ventureco_safe_ar/r01__2. VentureCo (A&R draft).pdf
      quote: the Original Safe and Original Side Letter are reinstated in full
    - file: documents/anonymized-demo-contracts/ventureco_safe_ar/r01__2. VentureCo (A&R draft).pdf
      quote: with the full $410,000 Purchase Amount deemed paid and outstanding under the Original Safe
    - file: documents/anonymized-demo-contracts/ventureco_safe/r01__1. VentureCo (Original).pdf
      quote: Post-Money Valuation Cap … is $14,000,000
    - file: documents/anonymized-demo-contracts/ventureco_safe/r01__1. VentureCo (Original).pdf
      quote: Discount Rate … is 85%
    - file: documents/anonymized-demo-contracts/ventureco_safe/r01__1. VentureCo (Original).pdf
      quote: means the lesser of the Safe Price and the Discount Price
    - file: documents/anonymized-demo-contracts/ventureco_safe/r01__1. VentureCo (Original).pdf
      quote: |-
        means the price per share equal to the Post-Money Valuation Cap divided by the Company Capitalization
  answer: 410,000 shares of Safe Preferred Stock.
  basis: |-
    The amendment and restatement is effective in the hypothetical because both parties execute and deliver it. The defined FundCo closing deadline is 11:59 p.m. Pacific time on April 1, 2027. FundCo never closes and no extension is signed. Amendment and Restatement Agreement §5 provides that expiration of the deadline without a FundCo closing automatically causes a Reversion Event. The replacement SAFEs cease prospectively; the original SAFE is reinstated with the complete $410,000 purchase amount. No separate cancellation notice is needed. The original SAFE has a $14,000,000 post-money valuation cap and 85% discount rate. SAFE price = $14,000,000 / 14,000,000 = $1.00/share. Discount price = $1.60 × 85% = $1.36/share. Conversion price = lesser of $1.00 and $1.36 = $1.00/share. Standard Preferred branch = $410,000 / $1.60 = 256,250 shares. Safe Preferred branch = $410,000 / $1.00 = 410,000 shares. The original SAFE §1(a) awards the greater number: 410,000 shares of Safe Preferred Stock.
  traps:
    - |-
      256,250 shares of Standard Preferred Stock: uses the financing price but overlooks the more favorable conversion-price branch.
    - |-
      approximately 301,471 shares of Safe Preferred Stock: applies only the 15% discount ($1.36) and misses the lower $1.00 cap price.
    - |-
      315,000 Safe Preferred shares plus approximately 256,249 Standard Preferred shares: incorrectly converts under the replacement Nominal and Cash SAFEs even though they ceased to apply after reversion.
    - '410,000 shares of Standard Preferred Stock: correct share count but incorrect class.'
    - |-
      0 shares / no conversion because FundCo never closed: confuses the failure of FundCo closing with the extinction of the original investment.
  notes: |-
    From the supplied anonymized drafts: original SAFE with $410,000 investment, $14m cap and 85% discount; A&R effective on both parties' execution/delivery; reversion mechanism; FundCo closing definition and April 1, 2027 deadline; treatment of original vs replacement instruments. Dollar values are pseudonymized and are not actual deal economics. Hypothetical premises added for the task: A&R executed October 19, 2026 (the PDF is labeled draft); FundCo never closing; no rejection notice; no extension; no MFN election; May 3, 2027 financing at $1.60; Company Capitalization of 14m shares.

