- id: AC.1
  split_from: AC
  source: expert
  reviewed: false
  title: |-
    GrantorCo Foundation grant letter — publicity and records access (GF original vs. SL 4.10.26 redline)
  prompt: |-
    AuditCo wants to issue a press release announcing that it received the grant, without sending the text to GrantorCo Foundation first. Separately, GF asks to inspect AuditCo's client records for a general "program evaluation" unrelated to how the grant funds were spent. Under the GF original grant letter, may AuditCo announce the grant without GF's prior review?
  files:
    - documents/anonymized-demo-contracts/gf_grant_letter/r01__GR-0001 SpecAgent - Grant Agreement (GF original, Mar 2026).pdf
    - documents/anonymized-demo-contracts/gf_grant_letter/r02__GR-0001 SpecAgent - Grant Agreement (SL 4.10.26).docx
  expected: {type: bool, value: false}
  evidence:
    - file: documents/anonymized-demo-contracts/gf_grant_letter/r01__GR-0001 SpecAgent - Grant Agreement (GF original, Mar 2026).pdf
      quote: |-
        You will allow GF to review and approve the text of any proposed publicity concerning this Grant prior to its release
  answer: |-
    (i) No: the original requires GF to review and approve any proposed publicity concerning the Grant before release. (ii) Yes: counsel's redline lets AuditCo publicly announce receipt of the Grant without GF's prior written consent; only additional publicity containing confidential information about the Grant needs GF review. (iii) Yes: the redline narrows access to GF's reasonable request to confirm use of Grant funds in accordance with Addendum I, replacing evaluations GF "deems necessary or appropriate concerning this Grant".
  basis: |-
    Original Addendum I, Publicity: "You will allow GF to review and approve the text of any proposed publicity concerning this Grant prior to its release". SL 4.10.26 Publicity, inserted: "are permitted to publicly announce receipt of the Grant without GF’s prior written consent". SL 4.10.26 Information and Access, inserted: "to confirm your use of Grant funds in accordance with this Addendum I".

