- id: AB.1
  split_from: AB
  source: expert
  reviewed: false
  title: LabsCo–AuditCo evaluation agreement — deadlines in the signed version (final 2.18.26)
  prompt: |-
    Use the final evaluation agreement LabsCo signed, whose Effective Date is 18 February 2026. On 12 March 2026 LabsCo emails AuditCo a notice of early termination; delivery to AuditCo's address is confirmed that day and no bounce-back or non-delivery notice is received. No other notice is given and neither party breaches. On what date does the agreement end?
  files:
    - documents/anonymized-demo-contracts/labsco_eval/r04__Master Form Evaluation Agreement - Penetration Testing - LabsCo Edits 2.18.26 (HL revisions 2.18.26).docx
    - documents/anonymized-demo-contracts/labsco_eval/r05__Evaluation Agreement - LabsCo (final 2.18.26).docx
  expected: {type: date, value: '2026-03-18'}
  evidence:
