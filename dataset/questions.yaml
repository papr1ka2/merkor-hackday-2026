# Q&A over the contracts in documents/.
#   source:   expert = from the team's Q&A index (redlines/INDEX.md + ANSWERS.md);
#             synthetic = written by Claude (none so far).
#   reviewed: false until an expert has checked `expected` and `evidence`, which Claude derived
#             from the expert's answer and basis. Everything else in an expert question is verbatim.
#   files:    paths relative to this directory; the agent is given exactly these files.
#   expected: typed answer fields, graded deterministically (bool | number | date | choice).
#             Questions without `expected` are deferred (free-text answers, not graded yet).
#   evidence: the controlling contract language (file + verbatim quote). An agent's answer is
#             ACCEPTed only if its own quotes exist in the files and overlap at least one of these.
#             DRAFT: extracted from `basis`; pending expert review.
#   answer / basis / trap: the expert's prose answer, supporting text, and a known wrong path.

- id: A
  source: expert
  reviewed: false
  title: ClientCo–AuditCo master services agreement (HL Draft 3.2.26 vs. HL Draft 3.18.26)
  prompt: |-
    The agreement's Effective Date is March 16, 2026. Neither party ever sends a termination notice, and the parties never discuss or agree to a renewal. Is the agreement still in force on April 1, 2027 under (i) the HL Draft 3.2.26 version and (ii) the HL Draft 3.18.26 version?
  files:
    - documents/anonymized-demo-contracts/clientco_msa/r01__ClientCo - AUDITCO MSA - (HL Draft 3.2.26).docx
    - documents/anonymized-demo-contracts/clientco_msa/r06__ClientCo - AUDITCO MSA (ClientCo comments 3.17.26) (HL Draft 3.18.26).docx
  expected:
    in_force_on_2027_04_01_under_hl_draft_3_2_26: {type: bool, value: true}
    in_force_on_2027_04_01_under_hl_draft_3_18_26: {type: bool, value: false}
  evidence:
    - file: documents/anonymized-demo-contracts/clientco_msa/r01__ClientCo - AUDITCO MSA - (HL Draft 3.2.26).docx
      quote: will automatically renew for one (1) year terms thereafter
    - file: documents/anonymized-demo-contracts/clientco_msa/r06__ClientCo - AUDITCO MSA (ClientCo comments 3.17.26) (HL Draft 3.18.26).docx
      quote: |-
        If the Parties do not mutually agree to enter into a Renewal Term, this Agreement will expire at the end of the Initial Term
  answer: |-
    (i) Yes. The agreement auto-renews into a one-year Renewal Term. (ii) No. It expires at the end of the one-year Initial Term, in March 2027.
  basis: |-
    3.2.26 §4(a): "will automatically renew for one (1) year terms thereafter". 3.18.26 §4(a): "If the Parties do not mutually agree to enter into a Renewal Term, this Agreement will expire at the end of the Initial Term".

- id: B
  source: expert
  reviewed: false
  title: |-
    ClientCo–AuditCo master services agreement (HL Draft 3.18.26, accepting all tracked changes)
  prompt: |-
    A third party sues ClientCo, alleging that AuditCo's Deliverables infringe its intellectual property. ClientCo's resulting losses, including reasonable attorneys' fees, are $2,300,000. What is the most AuditCo can be required to pay ClientCo under its indemnification obligation?
  files:
    - documents/anonymized-demo-contracts/clientco_msa/r06__ClientCo - AUDITCO MSA (ClientCo comments 3.17.26) (HL Draft 3.18.26).docx
  expected:
    max_indemnification_payment_usd: {type: number, value: 1750000}
  evidence:
    - file: documents/anonymized-demo-contracts/clientco_msa/r06__ClientCo - AUDITCO MSA (ClientCo comments 3.17.26) (HL Draft 3.18.26).docx
      quote: |-
        EACH PARTY’S LIABILITY FOR ITS INDEMNIFICATION OBLIGATIONS SHALL BE CAPPED AT ONE MILLION SEVEN HUNDRED FIFTY THOUSAND DOLLARS ($1,750,000.00)
  answer: |-
    $1,750,000. Without the tracked insertion (as in HL Draft 3.12.26), indemnification is an "Excluded Damages" carve-out from the cap, so the indemnity would be uncapped.
  basis: |-
    §12(b), inserted text: "EACH PARTY’S LIABILITY FOR ITS INDEMNIFICATION OBLIGATIONS SHALL BE CAPPED AT ONE MILLION SEVEN HUNDRED FIFTY THOUSAND DOLLARS ($1,750,000.00)". The trigger is §11(a), infringement by the Deliverables.

- id: C
  source: expert
  reviewed: false
  title: ClientCo–AuditCo master services agreement (HL Draft 3.12.26)
  prompt: |-
    In May, because of AuditCo's scheduled maintenance, ClientCo could not issue Requests and used only 135 of its monthly Maximum Requests. In June it submits 210 Requests. What is the total amount ClientCo is charged for June, counting the monthly Annual Fee installment and any per-Request overage?
  files:
    - documents/anonymized-demo-contracts/clientco_msa/r03__ClientCo - AUDITCO MSA (Crest LLP comments 3.10.26)(HL Draft 3.12.26).docx
  expected:
    june_total_charge_usd: {type: number, value: 22000}
  evidence:
    - file: documents/anonymized-demo-contracts/clientco_msa/r03__ClientCo - AUDITCO MSA (Crest LLP comments 3.10.26)(HL Draft 3.12.26).docx
      quote: shall be applied to the total number of Maximum Requests for the next month
    - file: documents/anonymized-demo-contracts/clientco_msa/r03__ClientCo - AUDITCO MSA (Crest LLP comments 3.10.26)(HL Draft 3.12.26).docx
      quote: either Party’s scheduled maintenance
  answer: |-
    $22,000. June's limit is 160 + 25 carried over = 185. Excess is 210 − 185 = 25 Requests × $140 = $3,500, plus the $18,500 monthly installment.
  basis: |-
    §1(c): unused Requests caused by Unavailability "shall be applied to the total number of Maximum Requests for the next month". Unavailability includes "either Party’s scheduled maintenance". Exhibit A: 160 Requests per month; $140.00 per excess Request; $18,500 per month.

- id: D
  source: expert
  reviewed: false
  title: ClientCo–AuditCo evaluation agreement (ClientCo 2.6.26 turn)
  prompt: |-
    The Effective Date is January 12, 2026. ClientCo emails AuditCo a notice of early termination on February 20, 2026. AuditCo opens it on February 24, 2026, and ClientCo receives the automated "opened" confirmation that day. Assuming no other notice, on what date does the agreement terminate?
  files:
    - documents/anonymized-demo-contracts/clientco_eval/r03__ClientCo - AuditCo Evaluation Agreement (ClientCo 2.6.26).docx
  expected:
    termination_date: {type: date, value: '2026-03-06'}
  evidence:
    - file: documents/anonymized-demo-contracts/clientco_eval/r03__ClientCo - AuditCo Evaluation Agreement (ClientCo 2.6.26).docx
      quote: ten (10) days’ prior written notice
    - file: documents/anonymized-demo-contracts/clientco_eval/r03__ClientCo - AuditCo Evaluation Agreement (ClientCo 2.6.26).docx
      quote: receipt of an automated confirmation of receipt that the recipient has opened the email
    - file: documents/anonymized-demo-contracts/clientco_eval/r03__ClientCo - AuditCo Evaluation Agreement (ClientCo 2.6.26).docx
      quote: two (2) months
  answer: |-
    March 6, 2026. Email notice is effective on February 24 (opened confirmation), plus 10 days. This falls before the Evaluation Period would end on March 12, 2026.
  basis: |-
    §8: "ten (10) days’ prior written notice". §9(a): email notice is given upon "receipt of an automated confirmation of receipt that the recipient has opened the email". §3: Evaluation Period is "two (2) months".

- id: E
  source: expert
  reviewed: false
  title: LabsCo–AuditCo master services agreement (February 9, 2026)
  prompt: |-
    LabsCo breaches the agreement, causing AuditCo $18,000 of otherwise recoverable direct damages and $4,000 of lost business profits. Separately, AuditCo's breach causes LabsCo $45,000 in direct damages. What is the most AuditCo can recover from LabsCo, and is LabsCo's $45,000 recovery capped by the agreement?
  files:
    - documents/anonymized-demo-contracts/labsco_msa/r01__2026-02-09 - AuditCo MSA.docx
  expected:
    max_auditco_recovery_usd: {type: number, value: 7500}
    labsco_recovery_is_capped: {type: bool, value: false}
  evidence:
    - file: documents/anonymized-demo-contracts/labsco_msa/r01__2026-02-09 - AuditCo MSA.docx
      quote: IN NO EVENT SHALL COMPANY BE LIABLE FOR … LOSS OF BUSINESS PROFITS
    - file: documents/anonymized-demo-contracts/labsco_msa/r01__2026-02-09 - AuditCo MSA.docx
      quote: |-
        COMPANY’S TOTAL CUMULATIVE LIABILITY OF EACH AND EVERY KIND UNDER THIS AGREEMENT EXCEED $7,500
  answer: |-
    AuditCo can recover at most $7,500, because lost profits are excluded and LabsCo's total liability is capped. LabsCo's $45,000 recovery is not capped, since the cap protects only the Company (LabsCo).
  basis: |-
    §8: "IN NO EVENT SHALL COMPANY BE LIABLE FOR … LOSS OF BUSINESS PROFITS" and "COMPANY’S TOTAL CUMULATIVE LIABILITY … [SHALL NOT] EXCEED $7,500". There is no matching cap on the Consultant (AuditCo).

