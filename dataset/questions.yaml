- id: O
  source: expert
  reviewed: false
  title: 'AutoCo–AuditCo mutual NDA: affiliate access (2026.10.26 AuditCo DRAFT)'
  prompt: |-
    Use the "(2026.10.26 AuditCo DRAFT)" version with all tracked changes accepted. An AutoCo Affiliate wants to receive AuditCo's Confidential Information. Its employees need the information for the Purpose, have been told it is confidential, and are bound by equally protective obligations. What must happen before the Affiliate may receive it? Would the same step be required under the "(draft)" version?
  files:
    - documents/anonymized-demo-contracts/autoco_nda/r02__AuditCo - AutoCo Mutual NDA (2026.10.26 AUDITCO DRAFT).docx
    - documents/anonymized-demo-contracts/autoco_nda/r01__AuditCo - AutoCo Mutual NDA (draft).docx
  evidence:
    - file: documents/anonymized-demo-contracts/autoco_nda/r02__AuditCo - AutoCo Mutual NDA (2026.10.26 AUDITCO DRAFT).docx
      quote: |-
        no Affiliate or its Representatives may receive Confidential Information unless that Affiliate has joined this Agreement under Section 12.3
  answer: |-
    The Affiliate must first join the Agreement through a written joinder signed by AutoCo, AuditCo and the Affiliate. The joinder must state the Affiliate's legal name, address, effective date and permitted scope. Under the draft no joinder is needed: an Affiliate is a "Representative" and may receive the information on need-to-know and notice alone.
  basis: |-
    Redline §2.3: "no Affiliate or its Representatives may receive Confidential Information unless that Affiliate has joined this Agreement under Section 12.3". §12.3 sets out the joinder. The draft's "Representatives" definition includes Affiliates.

- id: P
  source: expert
  reviewed: false
  title: |-
    ChainCo–AuditCo free trial agreement (AuditCo draft 2026.05.11 vs. Summit LLP redline, 5-18-2026)
  prompt: |-
    AuditCo wants to publish a marketing case study built solely from the Outputs of its evaluation of ChainCo's source code. The material has been anonymized so that nothing in it identifies, or is reasonably identifiable as relating to, ChainCo, but it has not been combined with information from any other customer or source. ChainCo has not consented. Is AuditCo permitted to use the material this way (i) under AuditCo's original draft dated 2026.05.11, and (ii) under the 5-18-2026 Summit LLP redline with all tracked changes accepted?
  files:
    - documents/anonymized-demo-contracts/chainco_trial/r01__Free Trial Ageement - Draft (2026.05.11).docx
    - documents/anonymized-demo-contracts/chainco_trial/r03__AuditCo -- Free Trial Agreement -- 5-18-2026.docx
  expected:
    permitted_under_2026_05_11_draft: {type: bool, value: true}
    permitted_under_5_18_2026_redline: {type: bool, value: false}
  evidence:
    - file: documents/anonymized-demo-contracts/chainco_trial/r01__Free Trial Ageement - Draft (2026.05.11).docx
      quote: |-
        AuditCo may use the Inputs, Outputs, and Feedback … for any purpose related to AuditCo’s internal business operations, including … marketing.
    - file: documents/anonymized-demo-contracts/chainco_trial/r03__AuditCo -- Free Trial Agreement -- 5-18-2026.docx
      quote: |-
        conditioned upon AuditCo first (i) anonymizing all such materials … and (ii) aggregating such materials with information derived from other customers or sources.
  answer: |-
    (i) Yes. The original draft lets AuditCo use Outputs for internal business purposes, including marketing, without anonymizing or aggregating them first. (ii) No. The redline requires AuditCo to both anonymize and aggregate the material before using it. Anonymizing alone is not enough, and ChainCo has not consented.
  basis: |-
    (i) Original draft, §4(a): "AuditCo may use the Inputs, Outputs, and Feedback … for any purpose related to AuditCo’s internal business operations, including … marketing." (ii) Redline, §4(a), inserted text: "conditioned upon AuditCo first (i) anonymizing all such materials … and (ii) aggregating such materials with information derived from other customers or sources."

- id: Q
  source: expert
  reviewed: false
  title: ChainCo–AuditCo free trial agreement (AuditCo draft 2026.05.11)
  prompt: |-
    The agreement's Effective Date is May 18, 2026. On June 10, 2026, ChainCo emails AuditCo a notice terminating the agreement; delivery is confirmed that day and no bounce-back is received. No other notice is given and neither party breaches. For Confidential Information that is not a trade secret, on what date do the parties' confidentiality obligations end?
  files:
    - documents/anonymized-demo-contracts/chainco_trial/r01__Free Trial Ageement - Draft (2026.05.11).docx
  expected:
    obligations_end_date: {type: date, value: '2031-06-18'}
  evidence:
    - file: documents/anonymized-demo-contracts/chainco_trial/r01__Free Trial Ageement - Draft (2026.05.11).docx
      quote: shall continue for a period of one (1) month.
    - file: documents/anonymized-demo-contracts/chainco_trial/r01__Free Trial Ageement - Draft (2026.05.11).docx
      quote: ten (10) days’ prior written notice.
    - file: documents/anonymized-demo-contracts/chainco_trial/r01__Free Trial Ageement - Draft (2026.05.11).docx
      quote: upon confirmed delivery.
    - file: documents/anonymized-demo-contracts/chainco_trial/r01__Free Trial Ageement - Draft (2026.05.11).docx
      quote: survive termination or expiration of this Agreement for a period of five (5) years.
  answer: |-
    June 18, 2031. The one-month Evaluation Period expires on June 18, 2026. That is before the termination notice would take effect on June 20, 2026 (ten days after effective email delivery on June 10). The obligations survive for five years from that expiration.
  basis: |-
    §3: the Evaluation Period "shall continue for a period of one (1) month." §8: termination requires "ten (10) days’ prior written notice." §9(a)(iv): email notice is given "upon confirmed delivery." §5(b): obligations "survive termination or expiration of this Agreement for a period of five (5) years."

- id: R
  source: expert
  reviewed: false
  title: VentureCo–AuditCo SAFE amendment and restatement (A&R draft)
  prompt: |-
    VentureCo and AuditCo sign the Amendment and Restatement Agreement, effective October 19, 2026. FundCo never closes its program package, nobody sends any notice about it, and the Closing Deadline is never extended. VentureCo makes no MFN election. On May 3, 2027, AuditCo holds the initial closing of an Equity Financing that sells Standard Preferred Stock at $1.60 per share; the Company Capitalization immediately before the financing is 14,000,000 shares. How many shares, and of which class, does VentureCo receive on conversion of its investment?
  files:
    - documents/anonymized-demo-contracts/ventureco_safe_ar/r01__2. VentureCo (A&R draft).pdf
    - documents/anonymized-demo-contracts/ventureco_safe/r01__1. VentureCo (Original).pdf
  expected:
    shares_received: {type: number, value: 410000}
    share_class: {type: choice, choices: [Safe Preferred Stock, Standard Preferred Stock, Common Stock], value: Safe Preferred Stock}
  evidence:
    - file: documents/anonymized-demo-contracts/ventureco_safe_ar/r01__2. VentureCo (A&R draft).pdf
      quote: (b) expiration of the Closing Deadline without FundCo Closing
    - file: documents/anonymized-demo-contracts/ventureco_safe_ar/r01__2. VentureCo (A&R draft).pdf
      quote: reinstated in full … with the full $410,000 Purchase Amount
  answer: |-
    410,000 shares of Safe Preferred Stock. The Closing Deadline (11:59 p.m. Pacific, April 1, 2027) expired without FundCo Closing, so a Reversion Event reinstated the Original Safe with the full $410,000 Purchase Amount. Safe Price = $14,000,000 / 14,000,000 = $1.00; Discount Price = $1.60 × 85% = $1.36; Conversion Price = the lesser, $1.00. Conversion is the greater of 410,000 / $1.60 = 256,250 Standard Preferred shares or 410,000 / $1.00 = 410,000 Safe Preferred shares.
  basis: |-
    A&R §5: Reversion Event on "(b) expiration of the Closing Deadline without FundCo Closing"; Original Safe "reinstated in full … with the full $410,000 Purchase Amount". Original Safe: "Post-Money Valuation Cap" is $14,000,000; "Discount Rate" is 85%; §1(a) "greater of"; §2 "Conversion Price" means the lesser of the Safe Price and the Discount Price.
  trap: |-
    applying the Replacement Safes instead (Cash Safe $409,997.75 at $1.60 = 256,248.59 shares plus Nominal Safe $2.25 at a $100 cap = 315,000 shares).
