# --- S–X: instruction fidelity and round causation, from the team's legal interactions ---

- id: S.1
  split_from: S
  source: expert
  reviewed: false
  title: |-
    ClientCo–AuditCo master services agreement — deal-term fidelity (HL Draft 3.2.26 → HL Draft 3.18.26)
  prompt: |-
    Before any draft existed, AuditCo told its counsel that the founders had verbally agreed that ClientCo's unused monthly scans (Requests) would roll over. Under the final HL Draft 3.18.26, ClientCo uses only 100 of its monthly Maximum Requests in July simply because it had nothing new to scan; there was no maintenance, outage, emergency or other Unavailability that month. How many Requests may ClientCo submit in August before per-Request overage charges apply?
  files:
    - documents/anonymized-demo-contracts/clientco_msa/r01__ClientCo - AUDITCO MSA - (HL Draft 3.2.26).docx
    - documents/anonymized-demo-contracts/clientco_msa/r06__ClientCo - AUDITCO MSA (ClientCo comments 3.17.26) (HL Draft 3.18.26).docx
  expected: {type: number, value: 160}
  evidence:
    - file: documents/anonymized-demo-contracts/clientco_msa/r06__ClientCo - AUDITCO MSA (ClientCo comments 3.17.26) (HL Draft 3.18.26).docx
      quote: |-
        If due to Unavailability ClientCo is unable to issue Requests … the number of unused Requests for that month shall be applied
    - file: documents/anonymized-demo-contracts/clientco_msa/r06__ClientCo - AUDITCO MSA (ClientCo comments 3.17.26) (HL Draft 3.18.26).docx
      quote: 'Maximum Requests per month: 160'
  answer: |-
    160 Requests (no carry-over). The term was narrowed, not implemented as given: unused Requests carry over only when Unavailability prevented ClientCo from issuing Requests or AuditCo from responding, and only into the next month. The narrowing was already in AuditCo's own first draft (HL Draft 3.2.26) and was never widened.
  basis: |-
    HL Draft 3.18.26 §1(c): "If due to Unavailability ClientCo is unable to issue Requests … the number of unused Requests for that month shall be applied to … the next month." Exhibit A: "Maximum Requests per month: 160".
  trap: |-
    Treating the founders' "unused scans roll over" as the contract rule (August limit 160 + 60 = 220).

