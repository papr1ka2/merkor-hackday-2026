    Conditions insertion: "This Section C expressly supersedes Section F in Addendum I." Section F (Licensing) is the refund-in-full clause. Use of Funds only requires repaying unused funds, and here there are none.

- id: I
  source: expert
  reviewed: false
  title: AuditCo–GrantorCo Foundation one-way NDA (SL 4.10.26)
  prompt: |-
    AuditCo discloses its proprietary vulnerability-analysis methodology to the Foundation Council of GrantorCo Foundation under this NDA. On 1 July 2027 GF sends written notice terminating the NDA. The methodology has never become public, GF did not know it beforehand, and no third party has disclosed it to GF. In 2034, seven years after termination, GF wants to describe the methodology in a public report. Is GF free to do so under the NDA?
  files:
    - documents/anonymized-demo-contracts/gf_nda/r01__AuditCo - GF - Non-Disclosure Agreement (SL 4.10.26).docx
  expected:
    gf_free_to_publish_in_2034: {type: bool, value: false}
  evidence:
    - file: documents/anonymized-demo-contracts/gf_nda/r01__AuditCo - GF - Non-Disclosure Agreement (SL 4.10.26).docx
      quote: |-
        will survive termination until Recipient can document that such Proprietary Information falls into one of the exceptions stated in Section 1.
  answer: |-
    No. The obligations have no time limit. They survive until the Recipient (GF) can document that a Section 1 exception applies, and none does.
  basis: |-
    §4: obligations "will survive termination until Recipient can document that such Proprietary Information falls into one of the exceptions stated in Section 1." The exceptions are prior knowledge, third-party disclosure and public availability.

