    Final §3: "shall continue for a period of one (1) month unless earlier terminated by either Party"; §8: "ten (10) days’ prior written notice"; §9(a)(iv): email notice is given "upon confirmed delivery to the recipient's email address"; §5(b): obligations "survive termination or expiration of this Agreement for a period of five (5) years".
  trap: |-
    Reading the period from the last tracked draft (two months, so the 22 March notice date controls and confidentiality runs to 22 March 2031), or using the master form's "opened the email" notice rule.

