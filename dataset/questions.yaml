  expected:
    max_recovery_usd: {type: number, value: 58000}
  evidence:
    - file: documents/anonymized-demo-contracts/gapl_vendor_services/r03__GAPL Vendor Services Agreement (AuditCo, Inc.) 20260424 (SL 5.8.26) (GF edits).docx
      quote: |-
        neither Party shall be liable … (a) … loss of profits, revenue … (b) direct damages in excess of any amounts paid … in the twelve months prior to the event
    - file: documents/anonymized-demo-contracts/gapl_vendor_services/r03__GAPL Vendor Services Agreement (AuditCo, Inc.) 20260424 (SL 5.8.26) (GF edits).docx
