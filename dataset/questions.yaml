        Seller shall return all amounts paid for the affected Products within ten (10) business days
    - file: documents/anonymized-demo-contracts/hardwareco_psa/r02__[order no.] AuditCo HardwareCo PSA (2026.11.03 AUDITCO DRAFT).docx
      quote: |-
        Such refunds shall not depend on upstream recovery or be reduced by fees, unrecovered commitments, liability limits or set-off
  answer: |-
    (i) $400,000.00. DRAFT_1 §2.8 limits any refund to what HardwareCo actually recovers from its supply chain ($430,000.00), net of the cancellation charge ($30,000.00), and makes that the sole remedy for unshipped Products; §4.5 independently caps HardwareCo's liability at its net supply-chain recovery. (ii) $612,500.00. The redline lets AuditCo cancel when HardwareCo cannot fulfil, including for loss of supply, and requires HardwareCo to return all amounts paid (released from escrow) within ten business days, not dependent on upstream recovery and not reduced by fees, unrecovered commitments, liability limits or set-off; the §4.2 cap expressly excludes these refund obligations, and §4.5's recovery ceiling is deleted.
  basis: |-
    DRAFT_1 §2.8: "Seller’s obligation is limited to the amount Seller actually recovers from its supply chain … net of any cancellation, restocking, administrative, or similar charge". Redline §2.8: "Seller shall return all amounts paid for the affected Products within ten (10) business days … Such refunds shall not depend on upstream recovery or be reduced by fees, unrecovered commitments, liability limits or set-off"; §4.2: "OR SELLER’S REFUND OBLIGATIONS UNDER SECTION 2.8".
  trap: |-
    Applying a liability cap to the refund: 10% of the amount paid ($61,250.00) under DRAFT_1 §4.2, or treating the redline refund as limited by the 100% cap or by upstream recovery.

