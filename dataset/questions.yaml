      quote: from any intellectual property made available or developed pursuant to this Agreement
  answer: |-
    Deleted. Counsel removed the general counsel's narrowing and the whole avoidance-of-doubt carve-out (which excluded anything derived from ChainCo's code or IP, or competing with it) and substituted a neutral definition, works conceived "from any intellectual property made available or developed pursuant to this Agreement". Undoing the carve-out is what reopened the issue. The anonymize-and-aggregate condition was retained.
