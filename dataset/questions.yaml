    AuditCo wants to decompile and reverse engineer the vehicle firmware binaries that AutoCo provides for the joint proof-of-concept, solely as reasonably necessary for that proof-of-concept, without any separate written authorization from AutoCo. Is that permitted (i) under the "(draft)" version, and (ii) under the "(2026.10.26 AuditCo DRAFT)" version with all tracked changes accepted?
